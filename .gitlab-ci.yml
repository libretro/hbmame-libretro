# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

# Core definitions
.core-defs:
  variables:
    MAKEFILE: Makefile.libretro
    CORENAME: hbmame
    REGENIE: 0

# Core definitions
include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'
    
  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-mingw.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # Linux 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-i686.yml'

  # MacOS 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  # MacOS ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  ################################## CELLULAR ################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-make.yml'
    
  # iOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios-arm64.yml'
    
  ################################## CONSOLES ################################
  # # Nintendo 3DS
  # - project: 'libretro-infrastructure/ci-templates'
  #   file: '/ctr-static.yml'
    
  # # Nintendo WiiU
  # - project: 'libretro-infrastructure/ci-templates'
  #   file: '/wiiu-static.yml'

  # # Nintendo Switch
  # - project: 'libretro-infrastructure/ci-templates'
  #   file: '/libnx-static.yml'

  # # PlayStation Vita
  # - project: 'libretro-infrastructure/ci-templates'
  #   file: '/vita-static.yml'
  
  # tvOS (AppleTV)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/tvos-arm64.yml'

  #################################### MISC ##################################

  # webOS 32-bit (LGTV)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/webos-make.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

# Cache
# Need to set a proper key in each job
# The -v2 suffix abandons the old cache namespace on purpose: it holds
# emu.h.gch files built against source mtimes that no longer exist, and
# nothing in the build rebuilds them, so clang/gcc fail the PCH validity
# check instead ("has been modified since the precompiled header was
# built" / "one or more PCH files were found, but they were invalid").
# Bump the suffix again if that ever comes back.
cache: &global_cache
  untracked: true
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-v2"
  paths:
    - build/

##############################################################################
#################################### STAGES ##################################
##############################################################################

################################### DESKTOPS #################################
# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-mxe-win-cross-cores:gcc14
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# Windows 32-bit
libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-mxe-win-cross-cores:gcc14
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:backports
  variables:
    OVERRIDE_CC: /usr/bin/gcc-12
    OVERRIDE_CXX: /usr/bin/g++-12
    CXXFLAGS: -Wno-deprecated-declarations # Deprecation warnings aren't helpful on the libretro Gitlab
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# Linux ARM 64-bit
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
  variables:
    OVERRIDE_CC: /usr/bin/gcc-12
    OVERRIDE_CXX: /usr/bin/g++-12
    CXXFLAGS: -Wno-deprecated-declarations # Deprecation warnings aren't helpful on the libretro Gitlab
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# Linux 32-bit
libretro-build-linux-i686:
  extends:
    - .libretro-linux-i686-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-i386-ubuntu:backports
  variables:
    OVERRIDE_CC: /usr/bin/gcc-12
    OVERRIDE_CXX: /usr/bin/g++-12
    CXXFLAGS: -Wno-deprecated-declarations # Deprecation warnings aren't helpful on the libretro Gitlab
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/
    
# MacOS 64-bit
# Cross-built on the Apple Silicon runner: the Intel mac runner is still on
# Apple clang 12 and GENie stops with "Clang version 13 or later needed".
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  variables:
    MACOSX_DEPLOYMENT_TARGET: "10.14"
  tags:
    - mac-apple-silicon
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# MacOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
  variables:
    MACOSX_DEPLOYMENT_TARGET: "10.14"
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/
    
################################### CELLULAR #################################
# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-android-make-armeabi-v7a
    - .core-defs
  variables:
    TARGET: hbmame
    ANDROID_NDK_NEXT: 29.0.14206865
    WITH_ANDROID: 30
  cache:
    <<: *global_cache
  only:
    - master
    - /^libretro/mame.*$/

# Android ARMv8a
android-arm64-v8a:
